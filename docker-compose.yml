# Sweety — docker-compose (PostgreSQL + API + frontend)
# Run: docker compose up --build
#   db on :5432, API on :5000, app on :80
# NOTE: not executed on the build machine (no Docker there) — please
# verify with `docker compose up --build` in an environment with Docker.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - sweety-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://sweety:sweety@db:5432/sweety
      JWT_SECRET: change-me-to-a-long-random-secret
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  sweety-data:
